[project]
name = "badminton-review-backend"
version = "0.1.0"
description = "Local badminton match review and scoring backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2.1,<3",
  "imageio-ffmpeg>=0.6,<1",
  "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
